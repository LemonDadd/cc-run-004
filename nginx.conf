server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    charset utf-8;

    # gzip 压缩（笔顺数据 6.5MB → 约 2.4MB）
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 优先使用预生成的 .gz
    gzip_static on;

    # 静态资源缓存
    location ~* \.(?:css|js|json|svg|png|jpg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Service Worker 不缓存
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
